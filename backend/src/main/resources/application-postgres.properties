# ===================================================================
# Render Cloud PostgreSQL Profile Configuration
# Profile: postgres (Activate with: SPRING_PROFILES_ACTIVE=postgres)
# ===================================================================

# Standard DataSource properties (used if DATABASE_URL adapter is not invoked)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:medicare_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# HikariCP Connection Pool settings optimized for Render Free Tier
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Spring Data JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Disable Flyway (schema auto-created by Hibernate update, seed data by DataInitializer)
spring.flyway.enabled=false
