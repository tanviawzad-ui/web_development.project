# ===================================================================
# Render Infrastructure Blueprint (render.yaml)
# Project: MediCare Multispeciality Hospital Management System
# Full-Stack: Spring Boot 3 + PostgreSQL + React 18 + Vite
# ===================================================================

services:
  # -----------------------------------------------------------------
  # 1. Spring Boot 3 Backend Web Service (Docker Container)
  # -----------------------------------------------------------------
  - type: web
    name: medicare-backend
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /api/departments
    autoDeploy: true
    envVars:
      # Activate cloud PostgreSQL profile
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      # Automatically bind Render's internal managed database URL
      - key: DATABASE_URL
        fromDatabase:
          name: medicare-db
          property: connectionString
      # Secure JWT Secret Key (HMAC-SHA256 Base64-compatible)
      - key: JWT_SECRET
        generateValue: true
      # 24-hour token expiration (86400000 ms)
      - key: JWT_EXPIRATION_MS
        value: 86400000
      # Cloud CORS: allow all Render subdomains and local dev testing
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.onrender.com,http://localhost:5173,http://localhost:3000

  # -----------------------------------------------------------------
  # 2. React 18 + Vite Frontend Static Site
  # -----------------------------------------------------------------
  - type: static
    name: medicare-frontend
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      # Single Page Application (SPA) rewrite rule to handle React Router URLs
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Connect the frontend to the deployed backend service
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: medicare-backend
          property: host

databases:
  # -----------------------------------------------------------------
  # 3. Managed PostgreSQL Database (Free Tier)
  # -----------------------------------------------------------------
  - name: medicare-db
    databaseName: medicare_db
    user: medicare_user
    plan: free
    region: oregon
    postgresMajorVersion: 16
